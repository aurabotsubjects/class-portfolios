</head>
<body class="dashpage">
<main id="pf"></main>
<script>
const { $, svg, CFG, api, store, renderPortfolio, firstName, avColor, initials } = CP;
const token = () => store.get('cp_s');
if (!token()) location.replace('/');
api('my', { token: token() }).then((d) => {
  document.title = firstName(d.student.name) + '’s portfolio';
  CP.dashboard($('#pf'), d, { who: 'student', onDone: () => { store.del('cp_s'); location.href = '/#switch'; }, pfOpts: { canDelete: true, token, showInbox: true, emptyText: 'Open a class app and tap “Save to portfolio” to add your work.' } });
}).catch((e) => { if (e.status === 401) { store.del('cp_s'); location.href = '/'; } else $('#pf').innerHTML = '<div class="empty"><p>' + CP.esc(e.message) + '</p></div>'; });
</script>
</body>
</html>
