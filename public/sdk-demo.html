<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Portfolio test page</title>
<style>
  body{margin:0;padding:24px;font:17px/1.5 system-ui,sans-serif;background:#eef6f2;color:#222}
  main{max-width:720px;margin:auto}
  canvas{width:100%;height:300px;background:#fff;border:2px solid #333;border-radius:10px;touch-action:none;display:block}
  button{font:inherit;padding:8px 16px;margin:10px 8px 0 0;border-radius:8px;border:2px solid #333;background:#fff;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1>Portfolio test page</h1>
  <p>This is a pretend classroom app, used to check the “Save to portfolio” button works. Draw something, then tap the button at the bottom right.</p>
  <canvas id="c" width="1200" height="600"></canvas>
  <button id="clr">Clear</button>
  <button id="quiz">Finish a pretend quiz (8/10)</button>
  <button id="txt">Save my writing as text</button>
  <p id="log" style="color:#555"></p>
</main>
<script>
const c = document.getElementById('c'), x = c.getContext('2d'); let d = false;
x.lineWidth = 8; x.lineCap = 'round'; x.strokeStyle = '#3b3656';
const pos = (e) => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
c.onpointerdown = (e) => { d = true; x.beginPath(); x.moveTo(...pos(e)); };
c.onpointermove = (e) => { if (d) { x.lineTo(...pos(e)); x.stroke(); } };
addEventListener('pointerup', () => (d = false));
document.getElementById('clr').onclick = () => x.clearRect(0, 0, c.width, c.height);
document.getElementById('quiz').onclick = () => ClassPortfolio.offer({ title: 'Pretend quiz', score: 8, total: 10, subject: 'Maths', details: [{ q: '7 × 8', answer: '56', correct: true }, { q: '9 × 6', answer: '52', correct: false }] }, 'Save your quiz score to your portfolio?');
document.getElementById('txt').onclick = () => ClassPortfolio.send({ text: 'Once upon a time, there was a very clever robot…', title: 'My story', subject: 'Writing' });
addEventListener('portfolio:sent', (e) => (document.getElementById('log').textContent = 'Saved: ' + e.detail.title + ' → ' + e.detail.subject));
</script>
<script src="/sdk.js" data-subject="Maths" data-app="Test page" defer></script>
</body>
</html>
